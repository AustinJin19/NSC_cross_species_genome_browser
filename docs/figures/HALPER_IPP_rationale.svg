<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc">
<title id="title">Combining HALPER and IPP: complementary mapping, separate validation</title><desc id="desc">A source ATAC peak enters HALPER interval reconstruction and IPP anchor-based point projection. Their outputs are stratified into agreement, tool-specific candidates, or conflicts, then evaluated using liver ATAC and other evidence. Shared alignments mean correlated errors.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#50647c" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="1060" fill="#f5f8fc"/>
<text x="48" y="52" font-family="Arial, sans-serif" font-size="34" fill="#003e7e" font-weight="bold">Why combine HALPER and IPP?</text>
<text x="48" y="86" font-family="Arial, sans-serif" font-size="19" fill="#23364c" font-weight="normal">Proposed strategy for 35-species liver ATAC data • Conceptual schematic, not measured results</text>
<rect x="48" y="110" width="1304" height="140" rx="12" fill="white" stroke="#ccd8e5"/>
<text x="70" y="143" font-family="Arial, sans-serif" font-size="23" fill="#003e7e" font-weight="bold">A  Common input</text>
<text x="70" y="176" font-family="Arial, sans-serif" font-size="21" fill="#23364c" font-weight="normal">Exact genome assemblies + species alignment + source liver ATAC peak</text>
<path d="M880,183 L1300,183" stroke="#50647c" stroke-width="2" fill="none"/>
<rect x="975" y="165" width="200" height="36" rx="3" fill="#d1e0f2" stroke="none"/>
<path d="M1075,154 L1075,214" stroke="#003e7e" stroke-width="3" fill="none"/>
<text x="954" y="237" font-family="Arial, sans-serif" font-size="16" fill="#23364c" font-weight="normal">Peak interval and same focal point</text>
<text x="70" y="211" font-family="Arial, sans-serif" font-size="18" fill="#23364c" font-weight="normal">Use the same summit for both tools; keep stable source peak IDs.</text>
<path d="M450,250 L365,292" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M950,250 L1035,292" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="300" width="636" height="300" rx="12" fill="white" stroke="#ccd8e5"/>
<rect x="716" y="300" width="636" height="300" rx="12" fill="white" stroke="#ccd8e5"/>
<text x="70" y="338" font-family="Arial, sans-serif" font-size="24" fill="#176d64" font-weight="bold">B1  HALPER: recover an interval</text>
<text x="738" y="338" font-family="Arial, sans-serif" font-size="24" fill="#976019" font-weight="bold">B2  IPP: estimate a corresponding point</text>
<text x="70" y="374" font-family="Arial, sans-serif" font-size="20" fill="#23364c" font-weight="normal">Mapped fragments + mapped summit</text>
<path d="M95,409 L620,409" stroke="#50647c" stroke-width="2" fill="none"/>
<rect x="140" y="396" width="55" height="25" rx="2" fill="#2c887b" stroke="none"/>
<rect x="220" y="396" width="95" height="25" rx="2" fill="#2c887b" stroke="none"/>
<rect x="348" y="396" width="43" height="25" rx="2" fill="#2c887b" stroke="none"/>
<rect x="430" y="396" width="80" height="25" rx="2" fill="#2c887b" stroke="none"/>
<path d="M270,385 L270,431" stroke="#123f39" stroke-width="3" fill="none"/>
<path d="M325,436 L325,464" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="140" y="477" width="370" height="28" rx="3" fill="#b6ddd5" stroke="#2c887b"/>
<path d="M270,470 L270,513" stroke="#123f39" stroke-width="3" fill="none"/>
<text x="70" y="548" font-family="Arial, sans-serif" font-size="18" fill="#23364c" font-weight="normal">Strength: reconstructs fragmented correspondence.</text>
<text x="70" y="577" font-family="Arial, sans-serif" font-size="18" fill="#23364c" font-weight="normal">Limit: focal mapping and interval filters must pass.</text>
<text x="738" y="374" font-family="Arial, sans-serif" font-size="20" fill="#23364c" font-weight="normal">Alignable anchors + optional bridging species</text>
<text x="740" y="417" font-family="Arial, sans-serif" font-size="17" fill="#23364c" font-weight="normal">Source</text>
<path d="M825,411 L1308,411" stroke="#50647c" stroke-width="2" fill="none"/>
<rect x="864" y="403" width="20" height="16" rx="2" fill="#d0a25b" stroke="none"/>
<rect x="1250" y="403" width="20" height="16" rx="2" fill="#d0a25b" stroke="none"/>
<text x="740" y="458" font-family="Arial, sans-serif" font-size="17" fill="#23364c" font-weight="normal">Bridge</text>
<path d="M825,452 L1308,452" stroke="#50647c" stroke-width="2" fill="none"/>
<rect x="864" y="444" width="20" height="16" rx="2" fill="#d0a25b" stroke="none"/>
<rect x="1250" y="444" width="20" height="16" rx="2" fill="#d0a25b" stroke="none"/>
<text x="740" y="499" font-family="Arial, sans-serif" font-size="17" fill="#23364c" font-weight="normal">Target</text>
<path d="M825,493 L1308,493" stroke="#50647c" stroke-width="2" fill="none"/>
<rect x="864" y="485" width="20" height="16" rx="2" fill="#d0a25b" stroke="none"/>
<rect x="1250" y="485" width="20" height="16" rx="2" fill="#d0a25b" stroke="none"/>
<path d="M1030,398 L1030,423" stroke="#976019" stroke-width="3" fill="none"/>
<path d="M1030,423 L1065,441" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M1065,464 L1100,482" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<circle cx="1065" cy="452" r="6" fill="#976019"/><circle cx="1100" cy="493" r="7" fill="#976019"/>
<text x="738" y="548" font-family="Arial, sans-serif" font-size="18" fill="#23364c" font-weight="normal">Strength: proposes loci beyond direct matches.</text>
<text x="738" y="577" font-family="Arial, sans-serif" font-size="18" fill="#23364c" font-weight="normal">Limit: positional estimate; no enhancer boundaries.</text>
<path d="M365,600 L365,632" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1035,600 L1035,632" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="640" width="1304" height="172" rx="12" fill="white" stroke="#ccd8e5"/>
<text x="70" y="675" font-family="Arial, sans-serif" font-size="24" fill="#003e7e" font-weight="bold">C  Combine evidence without collapsing uncertainty</text>
<rect x="70" y="696" width="385" height="87" rx="12" fill="#e1eee9" stroke="none"/>
<text x="86" y="728" font-family="Arial, sans-serif" font-size="21" fill="#23364c" font-weight="bold">Agreement</text>
<text x="86" y="761" font-family="Arial, sans-serif" font-size="17" fill="#23364c" font-weight="normal">Same locus • retain both records</text>
<rect x="480" y="696" width="385" height="87" rx="12" fill="#fff0d8" stroke="none"/>
<text x="496" y="728" font-family="Arial, sans-serif" font-size="21" fill="#23364c" font-weight="bold">Tool-specific candidate</text>
<text x="496" y="761" font-family="Arial, sans-serif" font-size="17" fill="#23364c" font-weight="normal">HALPER-only or IPP rescue</text>
<rect x="890" y="696" width="440" height="87" rx="12" fill="#f5e4e7" stroke="none"/>
<text x="906" y="728" font-family="Arial, sans-serif" font-size="21" fill="#23364c" font-weight="bold">Conflict / multiple mappings</text>
<text x="906" y="761" font-family="Arial, sans-serif" font-size="17" fill="#23364c" font-weight="normal">Retain alternatives • flag ambiguity</text>
<path d="M700,812 L700,840" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="848" width="1304" height="120" rx="12" fill="#e8f0fa" stroke="#b8cee9"/>
<text x="70" y="883" font-family="Arial, sans-serif" font-size="24" fill="#003e7e" font-weight="bold">D  Test biological conservation separately</text>
<text x="70" y="918" font-family="Arial, sans-serif" font-size="20" fill="#23364c" font-weight="normal">Target liver ATAC replicates • local synteny • matched controls • histone marks • functional assays</text>
<text x="70" y="949" font-family="Arial, sans-serif" font-size="19" fill="#23364c" font-weight="bold">Homologous locus  ≠  conserved accessibility  ≠  experimentally conserved regulatory function</text>
<text x="48" y="1007" font-family="Arial, sans-serif" font-size="20" fill="#23364c" font-weight="bold">Expected benefit: broader candidate recovery. Accuracy and extra recovery must be benchmarked.</text>
<text x="48" y="1036" font-family="Arial, sans-serif" font-size="17" fill="#23364c" font-weight="normal">Shared HAL input can produce correlated errors: agreement is not independent validation. See guide for sources and criteria.</text>
</svg>